<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Give a Review</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #fff; text-align: center; }
        .review-card { 
            background: #f8fafc; padding: 15px; margin: 10px 0; 
            border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer;
        }
        .review-card:active { background: #e2e8f0; }
    </style>
</head>
<body>

    <h2>Tap to Select a Review</h2>
    <p>The review will be copied automatically, just paste it on Google!</p>

    <div id="reviews-container"></div>

    <script>
        // Yahan tum apne 10-20 professional reviews daal sakte ho
     const reviews = [
            "Food bohot hi lajawab tha aur ambience bhi ekdum mast hai. Highly recommended!",
            "Bhai, yahan ki coffee aur vibe dono awesome hain. Best place to chill with friends.",
            "Taste aur quality ke hisaab se completely paisa vasool. Staff is very polite.",
            "Ekdum authentic taste! Yahan ka environment family ke liye bahut acha hai.",
            "Mujhe yahan ki vibe bahut pasand aayi. Perfect place for weekend hangout.",
            "Food quality is top-notch. Prices bhi kaafi reasonable hain. Must try!",
            "Awesome experience. Khana fresh tha aur presentation bhi kamaal ki thi.",
            "Best cafe in the area! Ambience itna soothing hai ki baar-baar aane ka mann karta hai.",
            "Overall great experience. Staff ka behaviour bohot friendly aur professional tha.",
            "Taste me koi compromise nahi! Super delicious food and great service.",
            "Kaafi peaceful place hai. Doston ke sath time spend karne ke liye perfect.",
            "Food was good, but yahan ki cleanliness aur hygiene mujhe sabse achi lagi. 5 stars!",
            "Very aesthetic place! Photos ke liye lighting achi hai aur khana bhi tasty hai.",
            "Ekdum premium feel wala cafe. Loved the music and the food!",
            "Pocket-friendly aur super tasty. Yahan ka menu sach me try karne layak hai.",
            "Customer service is very prompt. Humein bilkul wait nahi karna pada.",
            "Agar aapko quality time spend karna hai with good food, then this is the place.",
            "Vibe check passed! Khana, music, aur log sab bahut badhiya the.",
            "Amazing hospitality! Owner aur staff sabka nature bahut welcoming hai.",
            "Taste is unforgettable. Main yahan apne family ke sath gaya tha, sabko bahut pasand aaya.",
            "Shaam ko doston ke sath chill karne ka sabse badhiya adda. Good food, good mood!",
            "Aesthetic interiors aur usse bhi badhiya khana. 5 stars from my side.",
            "Portion size aur taste dono perfect the. Definitely coming back for more.",
            "Highly satisfied! Quality maintain karke rakhi hai inhone. Best in city.",
            "Service thodi aur fast ho sakti thi, but khana itna tasty tha ki maza aa gaya. Will visit again."
        ];

        const container = document.getElementById("reviews-container");

        reviews.forEach(text => {
            let div = document.createElement("div");
            div.className = "review-card";
            div.innerText = text;
            div.onclick = () => copyAndRedirect(text);
            container.appendChild(div);
        });

        function copyAndRedirect(text) {
            // Clipboard me copy karne ka code
            navigator.clipboard.writeText(text).then(() => {
                // URL se owner ka Google link nikalna
                const urlParams = new URLSearchParams(window.location.search);
                const gLink = urlParams.get('link');
                
                if(gLink) {
                    window.location.href = gLink; // Google page par bhejo
                } else {
                    alert("Google link is missing!");
                }
            }).catch(() => {
                alert("Copy fail hua, manually copy karein.");
            });
        }
    </script>
</body>
</html>
